# config.yaml
# ═══════════════════════════════════════════════════════
#  Cephalon Luna — Configuração Central
#  Edite aqui para ajustar o comportamento do modelo.
#  Não é necessário mexer no código Python.
# ═══════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────
#  CAMINHOS
# ───────────────────────────────────────────────────────
paths:
  raw_data:        "data/raw"
  processed_data:  "data/processed"
  tokenizer:       "data/tokenizer/tokenizer.json"
  latest_model:    "models/latest/model.pth"
  checkpoints:     "models/checkpoints"
  logs:            "models/logs"

# ───────────────────────────────────────────────────────
#  DADOS
# ───────────────────────────────────────────────────────
data:
  augment:         false
  val_ratio:       0.1

# ───────────────────────────────────────────────────────
#  MODELO
# ───────────────────────────────────────────────────────
model:
  vocab_size:      2000
  context_len:     128
  d_model:         128
  num_heads:       4
  num_layers:      4
  d_ff:            512
  dropout:         0.1

# ───────────────────────────────────────────────────────
#  TREINAMENTO
# ───────────────────────────────────────────────────────
training:
  epochs:          20
  batch_size:      8
  lr:              3e-4
  grad_clip:       1.0
  resume:          false
  grad_accum_steps: 1

  scheduler:
    enabled:       true
    type:          "cosine"
    warmup_epochs: 5

# ───────────────────────────────────────────────────────
#  GERAÇÃO
# ───────────────────────────────────────────────────────
generation:
  temperature:     0.6
  top_k:           10
  max_new_tokens:  50

# ───────────────────────────────────────────────────────
#  CHECKPOINTS
# ───────────────────────────────────────────────────────
checkpoint:
  save_every_n:    2
  keep_last_n:     1

# ───────────────────────────────────────────────────────
#  LOGGING
# ───────────────────────────────────────────────────────
logging:
  log_every_pct:   50
  show_samples:    true
  num_samples:     1
  sample_prompts:
    # Persona/identidade — o tipo mais comum no seu dataset
    - "<usr>Como a Luna demonstra identidade própria em uma abertura de conversa?<sep>"
    # Explicação didática de regra gramatical
    - "<usr>Como Luna explicaria crase antes de feminino determinado a um Operador apressado?<sep>"
    # Tarefa de correção direta (formato `Ajuste ...`)
    - "<usr>Ajuste `Aprendi crase através de exemplos` sem perder a intenção original.<sep>"
    # Meta-instrução sobre tom/comportamento
    - "<usr>Como Luna responderia a \"corrija meu texto sem me humilhar\" sem perder precisão?<sep>"
    # Correção cirúrgica de frase (formato bem representado no corpus)
    - "<usr>Faça uma revisão cirúrgica de `Entreguei o relatório a equipe`.<sep>"
    # Fora da distribuição de propósito — testa se ela generaliza para o casual
    - "<usr>Olá cephalon!<sep>"

# ───────────────────────────────────────────────────────
#  HARDWARE
# ───────────────────────────────────────────────────────
hardware:
  device:          "auto"
  seed:            42
  amp:             true
  compile:         false
  num_workers:     2
  pin_memory:      true